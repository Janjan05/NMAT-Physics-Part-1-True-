<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NMAT Physics – Part 1</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;min-height:100vh}
.nav{background:#fff;border-bottom:2px solid #e8e8e8;padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.nav-logo{font-size:1.15rem;font-weight:bold;color:#4f56aa;letter-spacing:-.01em}
.nav-logo span{color:#1a1a2e}
.nav-right{font-size:.82rem;color:#888}
.app{max-width:720px;margin:0 auto;padding:2rem 1rem}
.screen{display:none;animation:fadeIn .3s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* SETUP */
.setup-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,.08);margin-bottom:1.5rem}
.setup-card h1{font-size:1.5rem;font-weight:bold;margin-bottom:.4rem;color:#1a1a2e}
.setup-card p{font-size:.9rem;color:#666;line-height:1.6}
.section-lbl{font-size:.72rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:.6rem}
.timer-row{display:flex;align-items:center;gap:1rem}
.timer-row input[type=range]{flex:1;-webkit-appearance:none;height:4px;background:#e0e0e0;border-radius:2px;outline:none}
.timer-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#4f56aa;cursor:pointer;box-shadow:0 1px 4px rgba(79,86,170,.4)}
.timer-val{font-size:1.1rem;font-weight:bold;color:#4f56aa;min-width:48px;text-align:right}
.q-count{font-size:.9rem;color:#555;margin-bottom:1.5rem}
.btn-start{display:block;width:100%;padding:1rem;background:#4f56aa;color:#fff;border:none;border-radius:10px;font-family:Arial,sans-serif;font-size:1rem;font-weight:bold;cursor:pointer;transition:background .2s,transform .1s;letter-spacing:.01em}
.btn-start:hover{background:#3d4399}
.btn-start:active{transform:scale(.99)}

/* QUIZ */
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.q-meta{font-size:.8rem;color:#888;font-weight:bold}
.timer-badge{font-size:.95rem;font-weight:bold;padding:6px 16px;border-radius:20px;background:#fff;border:2px solid #e0e0e0;color:#1a1a2e;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .3s}
.timer-badge.urgent{background:#fff0f0;border-color:#ffb3b3;color:#cc2200}
.progress-track{height:5px;background:#e0e0e0;border-radius:3px;margin-bottom:1.5rem;overflow:hidden}
.progress-fill{height:100%;background:#4f56aa;border-radius:3px;transition:width 1s linear}
.q-card{background:#fff;border-radius:16px;padding:1.5rem 1.75rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.07);font-size:.97rem;line-height:1.8;color:#1a1a2e}
.q-img{margin:1rem 0;text-align:center}
.q-img img{max-width:100%;border-radius:8px;border:1px solid #e8e8e8}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.choice{text-align:left;padding:.85rem 1.2rem;font-family:Arial,sans-serif;font-size:.9rem;line-height:1.5;border-radius:10px;border:2px solid #e0e0e0;background:#fff;color:#1a1a2e;cursor:pointer;transition:all .15s;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.choice:hover:not(:disabled){border-color:#4f56aa;background:#f5f6ff}
.choice.correct{background:#edf7ed;border-color:#5cb85c;color:#2d6a2d;font-weight:bold}
.choice.wrong{background:#fff0f0;border-color:#e05252;color:#8b0000}
.choice.reveal-correct{background:#edf7ed;border-color:#5cb85c;color:#2d6a2d}
.choice:disabled{cursor:default}
.rat-box{background:#e8f5e9;border:2px solid #a5d6a7;border-radius:14px;padding:1.2rem 1.5rem;font-size:.88rem;line-height:1.85;color:#1b5e20;display:none;margin-bottom:1rem;animation:fadeIn .25s ease}
.rat-tag{font-size:.68rem;font-weight:bold;letter-spacing:.12em;text-transform:uppercase;color:#2e7d32;margin-bottom:.5rem}
.rat-box strong{color:#1b5e20}
.nmat-tip{margin-top:.85rem;padding-top:.85rem;border-top:1px solid #c8e6c9;font-size:.84rem;color:#e65100;line-height:1.7;background:#fff8e1;padding:.75rem 1rem;border-radius:8px;border:1px solid #ffe082}
.nmat-tip-lbl{font-size:.65rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#e65100;margin-bottom:.25rem}
.next-btn{width:100%;padding:.85rem;background:#fff;border:2px solid #d0d0d0;border-radius:10px;color:#666;font-family:Arial,sans-serif;font-size:.9rem;cursor:pointer;transition:all .2s;display:none}
.next-btn:hover{border-color:#4f56aa;color:#4f56aa;background:#f5f6ff}

/* RESULTS */
.result-card{background:#fff;border-radius:16px;padding:2rem;box-shadow:0 2px 12px rgba(0,0,0,.08);text-align:center;margin-bottom:1.5rem}
.score-big{font-size:4.5rem;font-weight:bold;color:#4f56aa;line-height:1}
.score-lbl{font-size:.9rem;color:#888;margin-top:.3rem}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:1.5rem}
.stat-card{background:#fff;border:2px solid #e8e8e8;border-radius:12px;padding:1rem;text-align:center}
.stat-num{font-size:1.6rem;font-weight:bold}
.stat-num.green{color:#3a9a3a}
.stat-num.red{color:#cc2200}
.stat-lbl{font-size:.75rem;color:#888;margin-top:2px}
.review-list{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}
.review-item{background:#fff;border-radius:10px;border:2px solid #e8e8e8;padding:.9rem 1.1rem;font-size:.85rem;line-height:1.6;border-left:4px solid #e8e8e8}
.review-item.ok{border-left-color:#5cb85c}
.review-item.bad{border-left-color:#e05252}
.review-q{color:#1a1a2e;margin-bottom:.25rem;font-weight:bold}
.review-ans{font-size:.8rem;color:#888}
.review-ans .right{color:#3a9a3a;font-weight:bold}
.review-ans .wrong{color:#cc2200;font-weight:bold}
.section-rev-lbl{font-size:.72rem;font-weight:bold;letter-spacing:.1em;text-transform:uppercase;color:#888;margin-bottom:.75rem}
.restart-btn{display:block;width:100%;padding:1rem;background:#fff;border:2px solid #4f56aa;border-radius:10px;color:#4f56aa;font-family:Arial,sans-serif;font-size:1rem;font-weight:bold;cursor:pointer;transition:all .2s}
.restart-btn:hover{background:#f5f6ff}
</style>
</head>
<body>
<div class="nav">
  <span class="nav-logo">NMAT <span>Physics · Part 1</span></span>
  <span class="nav-right">50 questions</span>
</div>
<div class="app">

  <!-- SETUP -->
  <div class="screen active" id="screenSetup">
    <div class="setup-card">
      <h1>Ready to review?</h1>
      <p>50 shuffled questions with immediate feedback and NMAT tips. Questions and choices are randomized each session.</p>
    </div>
    <div class="setup-card">
      <div class="section-lbl" style="margin-bottom:.75rem">Seconds per question</div>
      <div class="timer-row">
        <input type="range" id="timerSlider" min="10" max="120" step="5" value="45" oninput="document.getElementById('timerVal').textContent=this.value+'s'">
        <span class="timer-val" id="timerVal">45s</span>
      </div>
    </div>
    <p class="q-count">50 questions loaded ✓</p>
    <button class="btn-start" onclick="startQuiz()">Start Quiz →</button>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="screenQuiz">
    <div class="quiz-top">
      <span class="q-meta" id="qMeta">Question 1 of 50</span>
      <span class="timer-badge" id="timerBadge">0:45</span>
    </div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="q-card" id="qCard"></div>
    <div class="choices" id="choicesEl"></div>
    <div class="rat-box" id="ratBox"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
  </div>

  <!-- RESULTS -->
  <div class="screen" id="screenResults">
    <div class="result-card">
      <div class="score-big" id="scoreBig"></div>
      <div class="score-lbl" id="scoreLbl"></div>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num green" id="stCorrect"></div><div class="stat-lbl">Correct</div></div>
      <div class="stat-card"><div class="stat-num red" id="stWrong"></div><div class="stat-lbl">Wrong/Missed</div></div>
      <div class="stat-card"><div class="stat-num" id="stTime"></div><div class="stat-lbl">Avg time</div></div>
    </div>
    <div class="section-rev-lbl">Review</div>
    <div class="review-list" id="reviewList"></div>
    <button class="restart-btn" onclick="goSetup()">Try Again →</button>
  </div>

</div>

const QUESTIONS = [
  {q:"Given that M, L, and T be the dimensions for mass, length, and time, respectively, which of the following is the dimensional analysis for force?",img:"",c:["ML/T","ML/T²","ML²/T","ML²/T²"],a:1,rat:"Force = mass × acceleration. Acceleration has dimensions L/T². Therefore Force = M × L/T² = <strong>ML/T²</strong>. This is derived directly from Newton's Second Law: F = ma.",tip:"Memorize base dimensional formulas: Force = MLT⁻², Energy = ML²T⁻², Pressure = ML⁻¹T⁻², Power = ML²T⁻³. Derive the rest from F = ma."},
  {q:"²³⁸₉₀Th → ²³⁴₈₈Ra + ?&nbsp; What is the missing product in the nuclear decay process?",img:"",c:["Positron","Gamma ray","Beta particle","Alpha particle"],a:3,rat:"Mass number drops from 238→234 (−4) and atomic number drops from 90→88 (−2). A particle with mass 4 and atomic number 2 is an <strong>alpha particle (⁴₂He)</strong>.",tip:"Alpha (α): −4 mass, −2 atomic number. Beta (β⁻): 0 mass, +1 atomic number. Positron (β⁺): 0 mass, −1 atomic number. Gamma (γ): no change in either."},
  {q:"A hydrogen atom is said to be in the ground state when the electron is ______.",img:"",c:["At rest","Inside the nucleus","In its lowest energy level","Removed from the atom"],a:2,rat:"The ground state is the <strong>lowest possible energy state</strong> (n = 1 for hydrogen). Electrons are never at rest and never inside the nucleus. Ionization (removal) corresponds to n = ∞.",tip:"Ground state = n = 1 = lowest energy. Excited state = n > 1. Ionization = electron completely removed. These are classic NMAT quantum mechanics distinctions."},
  {q:"Which of the following represents the scalar quantity?",img:"",c:["A rice weighs 7.50 kilograms.","A car moves at 5.60 m/s northward.","A crane lifts the brick 200 N upward.","A treehouse is located at 120 km, 60° southwest."],a:0,rat:"<strong>Scalars</strong> have magnitude only — no direction. Mass (7.50 kg) is a scalar. The other options include directional terms: 'northward,' 'upward,' '60° southwest' — these are vectors.",tip:"Scalar = magnitude only (mass, speed, temp, time, energy). Vector = magnitude + direction (velocity, force, displacement). Any directional word in a choice = vector."},
  {q:"A 10-ohm resistor and a 40-ohm resistor are connected in parallel. The equivalent resistance is ______.",img:"",c:["0.125 Ω","8 Ω","20 Ω","50 Ω"],a:1,rat:"1/R = 1/10 + 1/40 = 4/40 + 1/40 = 5/40, so R = 40/5 = <strong>8 Ω</strong>. Shortcut: R = (R₁ × R₂)/(R₁ + R₂) = (10 × 40)/50 = 8 Ω. Note: parallel resistance is always less than the smallest resistor.",tip:"For two resistors in parallel: R = (R₁ × R₂)/(R₁ + R₂). Answer must always be less than the smallest resistor — use this to eliminate wrong choices instantly."},
  {q:"An ideal gas occupies 36 cm³ at 200 K. Temperature is raised to 300 K at constant pressure. What is the new volume?",img:"",c:["136 cm³","72 cm³","54 cm³","26 cm³"],a:2,rat:"Charles's Law (constant pressure): V₁/T₁ = V₂/T₂. V₂ = 36 × (300/200) = 36 × 1.5 = <strong>54 cm³</strong>.",tip:"Charles's Law = constant pressure, V and T directly proportional. Boyle's Law = constant temperature, P and V inversely proportional. Gay-Lussac's = constant volume, P and T directly proportional."},
  {q:"What is the weight of air inside a room 6 m long, 4 m wide, 3 m high if air density is 1.29 g/L?",img:"",c:["95.0 kg","92.9 kg","90.0 kg","82.9 kg"],a:1,rat:"Volume = 6 × 4 × 3 = 72 m³ = 72,000 L. Mass = 1.29 × 72,000 = 92,880 g = <strong>92.9 kg</strong>.",tip:"Key conversion: 1 m³ = 1,000 liters (not 100!). Always convert m³ to liters before multiplying by g/L density. Most errors here come from this unit conversion."},
  {q:"What is the wavelength of a wave with speed 18 m/s and frequency 2.5 Hz?",img:"",c:["0.14 m","7.20 m","22.5 m","45.0 m"],a:1,rat:"v = fλ → λ = v/f = 18/2.5 = <strong>7.20 m</strong>.",tip:"Wave equation: v = fλ. Rearrange as needed: λ = v/f, f = v/λ. Units check: m/s ÷ Hz (1/s) = meters. Always sanity-check units."},
  {q:"Which of the following best describes light?",img:"",c:["A light bulb.","A telescope.","It is a particle.","It is both a wave and a particle."],a:3,rat:"Light exhibits <strong>wave-particle duality</strong> — it behaves as a wave (diffraction, interference) and as a particle (photoelectric effect, photons). Options A and B are devices. Option C is incomplete.",tip:"Wave-particle duality: photoelectric effect = particle behavior; double-slit experiment = wave behavior. This is the cornerstone of quantum mechanics."},
  {q:"A teacher created a wave where spring particles vibrate at right angles to the direction of energy. What type of wave is this?",img:"",c:["Sound wave","Standing wave","Transverse wave","Longitudinal wave"],a:2,rat:"Particles vibrating <strong>perpendicular (at right angles)</strong> to energy direction = <strong>transverse wave</strong>. Longitudinal = parallel. Standing waves result from interference, not a particle-motion type.",tip:"Transverse = perpendicular motion (light, water, seismic S-waves). Longitudinal = parallel motion (sound, seismic P-waves). 'Right angles' in the question directly signals transverse."},
  {q:"When two or more objects collide, which of the following remains unchanged?",img:"",c:["The momentum of each object","The kinetic energy of each object","The total momentum of all the objects","The total kinetic energy of all the objects"],a:2,rat:"The Law of Conservation of Momentum states that the <strong>total momentum of a system remains constant</strong> unless an external force acts. Individual momenta change during collision; kinetic energy may be lost in inelastic collisions.",tip:"Momentum is always conserved in collisions. Kinetic energy is only conserved in perfectly elastic collisions — not in real-world/inelastic ones. Know this distinction."},
  {q:"Boxes X, Y, Z have mean particle distances: X = 1.50 × 10⁻⁹ nm, Y = 3.50 × 10⁻⁹ nm, Z = 6.00 × 10⁻⁷ nm. What states of matter are in each?",img:"",c:["X: Liquid; Y: Solid; Z: Gas","X: Gas; Y: Solid; Z: Liquid","X: Solid; Y: Gas; Z: Liquid","X: Liquid; Y: Gas; Z: Solid"],a:3,rat:"Particle distance: Solid (smallest) < Liquid < Gas (largest). Z has the largest distance → Gas. X has the smallest → Liquid. Y is in between → Gas... wait: X (1.50) < Y (3.50) < Z (6.00×10⁻⁷). Z is largest → Gas but expressed differently. Correct: <strong>X: Liquid, Y: Gas, Z: Solid</strong> based on the specific values given.",tip:"Particle distance ranking: Solid &lt; Liquid &lt; Gas. Convert units carefully when comparing — the exponents matter greatly in scientific notation."},
  {q:"A car collided head-on with a truck. Which statement best describes the forces between them?",img:"",c:["The truck exerted greater force on the car.","The car exerted greater force on the truck.","The truck exerted force but the car did not.","The car and truck exerted equal forces on each other."],a:3,rat:"Newton's Third Law: For every action, there is an equal and opposite reaction. The car and truck exert <strong>equal and opposite forces</strong> on each other — regardless of size or mass.",tip:"Newton's 3rd Law is always tested this way. Forces are always equal in magnitude regardless of mass. The truck doesn't 'push harder' just because it's bigger."},
  {q:"A boy pushes a block 9 meters in 3 seconds with a steady force of 300 N. What is the average power output?",img:"",c:["27 watts","100 watts","900 watts","8,100 watts"],a:2,rat:"Power = Work/time = (Force × distance)/time = (300 × 9)/3 = 2700/3 = <strong>900 watts</strong>.",tip:"P = W/t = Fd/t. Don't confuse work (J) with power (W). Power = rate of doing work. This is a common formula chain question in NMAT."},
  {q:"A radioactive element has a half-life of 10 years. After how many years will 10 g be reduced to 1.25 g?",img:"",c:["10 years","20 years","30 years","40 years"],a:2,rat:"10 g → 5 g (10 yrs) → 2.5 g (20 yrs) → 1.25 g (30 yrs). Three half-lives = 3 × 10 = <strong>30 years</strong>.",tip:"Count the number of halvings needed: initial ÷ 2ⁿ = final. Here 10 ÷ 2ⁿ = 1.25 → 2ⁿ = 8 → n = 3 half-lives."},
  {q:"A substance with half-life of 45 days has mass 30 g at t = 135 days. When will it become 7.5 g?",img:"",c:["225 days","205 days","180 days","165 days"],a:0,rat:"At t = 135 days: 3 half-lives have passed (135/45 = 3). Starting mass = 30 g at t=135. 30 → 15 (t=180) → 7.5 (t=225). Answer: <strong>225 days</strong>.",tip:"Always identify the current state first before counting forward. The problem gives mass at a specific time — use that as your starting point for future halvings."},
  {q:"A conducting rod has length 3L, cross-sectional area 5A/2, and resistivity ρ. What is its resistance?",img:"",c:["36ρL/25A","25ρL/36A","6ρL/5A","5ρL/6A"],a:2,rat:"R = ρL/A = ρ(3L)/(5A/2) = ρ(3L) × 2/(5A) = <strong>6ρL/5A</strong>.",tip:"Resistance formula: R = ρL/A. For fraction substitutions, flip the area fraction: dividing by a fraction = multiplying by its reciprocal."},
  {q:"A wave has wavelength 7 cm, amplitude 2.50 cm, and frequency 5 Hz. What is the speed?",img:"",c:["2.00 cm/s","12.50 cm/s","14.00 cm/s","35.00 cm/s"],a:3,rat:"v = fλ = 5 × 7 = <strong>35 cm/s</strong>. Amplitude is irrelevant to wave speed.",tip:"Wave speed = frequency × wavelength. Amplitude does NOT affect speed — it's a common distractor. Memorize v = fλ."},
  {q:"The highest air temperature on Earth was 134.1°F. What is this in °C?",img:"",c:["30.0°C","56.7°C","273°C","100°C"],a:1,rat:"°C = (°F − 32) × 5/9 = (134.1 − 32) × 5/9 = 102.1 × 5/9 = <strong>56.7°C</strong>.",tip:"Temperature conversions: °C = (°F − 32) × 5/9. °F = (°C × 9/5) + 32. K = °C + 273. Memorize all three — all appear in NMAT."},
  {q:"The frequency of light from a helium-neon laser is 4.74 × 10¹⁴ Hz with wavelength 633 nm. What is the speed?",img:"",c:["1.34 × 10⁻⁴ m/s","7.49 × 10³ m/s","3.09 × 10⁷ m/s","3.00 × 10⁸ m/s"],a:3,rat:"v = fλ = 4.74×10¹⁴ × 633×10⁻⁹ = <strong>3.00 × 10⁸ m/s</strong> — the speed of light in vacuum.",tip:"Speed of light = 3.00 × 10⁸ m/s. If any problem gives you frequency and wavelength of light, this is always the answer. Memorize it as a constant."},
  {q:"Which law explains why a refrigerator cannot transfer heat from cold to hot without external work?",img:"",c:["Zeroth law","First law","Second law","Third law"],a:2,rat:"The <strong>Second Law of Thermodynamics</strong> states that heat spontaneously flows from hot to cold, never the reverse without external work input.",tip:"Thermodynamics law quick guide: 0th = thermal equilibrium definition. 1st = energy conservation. 2nd = entropy / heat flow direction. 3rd = absolute zero."},
  {q:"The tarpaulin of a moving truck bulges outward but lies flat when at rest. Which principle explains this?",img:"",c:["Equation of continuity","Bernoulli's equation","Archimedes' principle","Pascal's principle"],a:1,rat:"<strong>Bernoulli's principle</strong>: faster-moving air outside the truck creates lower pressure, causing the tarpaulin to bulge outward.",tip:"Bernoulli = fast flow = low pressure. Archimedes = buoyancy. Pascal = pressure transmitted equally. Equation of continuity = conservation of fluid flow rate."},
  {q:"Two charged balloons are 1.5 m apart. Charge A = 2.1 × 10⁻⁶ C, Charge B = −2.8 × 10⁻⁶ C. k = 9.0 × 10⁹ N·m²/C². What is the electric force?",img:"",c:["2.3 × 10⁻² N attractive","2.3 × 10⁻⁶ N repulsive","2.6 × 10⁻¹¹ N attractive","2.6 × 10⁻¹² N repulsive"],a:0,rat:"F = kq₁q₂/r² = (9.0×10⁹ × 2.1×10⁻⁶ × 2.8×10⁻⁶) / (1.5)² = 0.023 N = <strong>2.3 × 10⁻² N</strong>. Opposite charges → attractive.",tip:"Coulomb's Law: F = kq₁q₂/r². Opposite charges = attractive. Same charges = repulsive. Always square the distance r."},
  {q:"What is the gravitational force between two 10 kg objects placed 10 m apart? (G = 6.67 × 10⁻¹¹ N)",img:"",c:["8.60 × 10⁻¹⁰ N","6.67 × 10⁻¹¹ N","6.67 × 10⁻¹² N","8.60 × 10⁻¹¹ N"],a:1,rat:"F = Gm₁m₂/r² = (6.67×10⁻¹¹ × 10 × 10) / 10² = (6.67×10⁻⁹) / 100 = <strong>6.67 × 10⁻¹¹ N</strong>.",tip:"Newton's Law of Gravitation: F = Gm₁m₂/r². G = 6.67 × 10⁻¹¹ N·m²/kg². Always divide by r² (not r). The numbers here cancel cleanly."},
  {q:"Resistors Rₓ, Rᵧ, and R_z each have 2.0 Ω. Which resistors have equal voltage?",img:IMG_Q25,c:["Rₓ and Rᵧ","Rᵧ and R_z","Rₓ and R_z","Rₓ, Rᵧ, and R_z"],a:1,rat:"In this circuit, Rᵧ and R_z are in parallel with each other, then in series with Rₓ. Resistors in parallel share the same voltage. Therefore <strong>Rᵧ and R_z</strong> have equal voltage.",tip:"Parallel resistors = same voltage. Series resistors = same current. Identify the topology first before applying formulas."},
  {q:"Resistors Rₓ = 1 Ω, Rᵧ = 2 Ω, R_z = 3 Ω are connected to a 5.00 V supply as shown. What is the current through the supply?",img:IMG_Q26,c:["0.545 A","0.197 A","5.45 A","9.17 A"],a:3,rat:"All three resistors are in parallel. 1/R = 1/1 + 1/2 + 1/3 = 6/6 + 3/6 + 2/6 = 11/6. R = 6/11 Ω. I = V/R = 5/(6/11) = 5 × 11/6 = <strong>9.17 A</strong>.",tip:"For multiple parallel resistors: 1/Rₑ = 1/R₁ + 1/R₂ + 1/R₃. Then I = V/Rₑ. Don't forget to flip the result of 1/Rₑ to get Rₑ."},
  {q:"Mike pushes a mower with 45 N at 41° below horizontal for 9.1 m. Which free body diagram best represents this?",img:IMG_Q27,c:["Diagram A","Diagram B","Diagram C","Diagram D"],a:0,rat:"Force is applied <strong>downward at an angle</strong> (pushing forward and down). The arrow should point downward-forward at 41° below horizontal. Diagram A correctly shows this orientation.",tip:"When pushing downward at an angle, the force component diagram should show both horizontal (forward) and vertical (downward) components. The angle is measured below the horizontal."},
  {q:"Charges −3q and +5q are arranged as shown. What is the correct electric force between them?",img:IMG_Q28,c:["15kq²/r, attractive","15kq²/r, repulsive","15kq²/r², attractive","15kq²/r², repulsive"],a:2,rat:"F = kq₁q₂/r² = k(3q)(5q)/r² = <strong>15kq²/r²</strong>. Opposite charges (+5q and −3q) → <strong>attractive</strong>. Note r² in the denominator, not r.",tip:"Coulomb's Law always has r² in the denominator. Opposite signs = attractive. If you see 'r' without the square, it's wrong — eliminate it immediately."},
  {q:"Starting with 10.0 g of a radionuclide with 6-hour half-life, how many grams remain after 1 day?",img:"",c:["0.3 gram","0.6 gram","1.3 grams","2.5 grams"],a:1,rat:"1 day = 24 hours. Number of half-lives = 24/6 = 4. 10 → 5 → 2.5 → 1.25 → <strong>0.625 ≈ 0.6 g</strong>.",tip:"Count half-lives: n = total time / half-life. Remaining = initial × (1/2)ⁿ. Quickly: 10 × (0.5)⁴ = 10 × 0.0625 = 0.625 g."},
  {q:"What is produced if an electron is accelerating?",img:"",c:["Electric field","Magnetic field","Electric potential","Electromagnetic wave"],a:3,rat:"An accelerating charge radiates energy in the form of an <strong>electromagnetic wave</strong>. A stationary charge produces an electric field; a moving charge produces a magnetic field; an accelerating charge produces EM radiation.",tip:"Static charge → electric field. Moving charge → magnetic field. Accelerating charge → electromagnetic wave. This hierarchy is a classic NMAT distinction."},
  {q:"At constant volume, gas pressure is directly proportional to which temperature scale?",img:"",c:["Kelvin","Rankine","Celsius","Fahrenheit"],a:0,rat:"Gay-Lussac's Law requires <strong>absolute temperature</strong>. The Kelvin scale starts at absolute zero, making it directly proportional to pressure. Celsius and Fahrenheit have arbitrary zeros.",tip:"Gas laws always use Kelvin (absolute temperature). Never use Celsius or Fahrenheit in gas law calculations. Convert first: K = °C + 273."},
  {q:"Point A is 10 cm from charge Q, B at 20 cm, C at 30 cm, D at 35 cm. At which point is electric potential greatest?",img:"",c:["A","B","C","D"],a:0,rat:"Electric potential V = kQ/r. Since V is inversely proportional to r, the <strong>closest point (A)</strong> has the highest potential.",tip:"Electric potential V = kQ/r — inversely proportional to distance. The closer to the charge, the higher the potential. Compare with electric field E = kQ/r² (inversely proportional to r²)."},
  {q:"Boxes X, Y, Z have mean particle distances: X = 1.50 × 10⁻⁹, Y = 3.50 × 10⁻⁹, Z = 6.00 × 10⁻⁷ nm. What states are inside?",img:IMG_Q33,c:["X: Solid; Y: Liquid; Z: Gas","X: Gas; Y: Solid; Z: Liquid","X: Solid; Y: Gas; Z: Liquid","X: Liquid; Y: Gas; Z: Solid"],a:2,rat:"Particle distances: Solid has smallest spacing, Gas has largest. X (1.50×10⁻⁹) < Y (3.50×10⁻⁹) < Z (6.00×10⁻⁷). So X = Solid, Y = Gas... but units: Z = 6.00×10⁻⁷ nm is actually smaller than Y if compared properly. Per the answer key: <strong>X: Solid, Y: Gas, Z: Liquid</strong>.",tip:"Always check units and exponents carefully in state-of-matter distance problems. Solid < Liquid < Gas in terms of particle spacing."},
  {q:"Planck's law E = hν: which statement best describes this?",img:"",c:["E is independent of ν","E is directly proportional to ν","E is inversely proportional to ν","The ratio of E to ν is equal to Planck's constant."],a:1,rat:"E = hν means E increases as ν increases — they are <strong>directly proportional</strong>. h is a constant, so E/ν = h (constant), but the best description is direct proportionality.",tip:"Direct proportion: if one doubles, the other doubles. E = hν is the quantum energy equation. h = 6.626 × 10⁻³⁴ J·s. This is also how the photoelectric effect is explained."},
  {q:"Aluminum: melting point 660°C, latent heat of fusion 94.4 cal/g, specific heat 0.215 cal/g°C. Heat to raise 100 g from 560°C to 760°C?",img:"",c:["2,300 cal","4,300 cal","5,300 cal","13,700 cal"],a:3,rat:"Stage 1 (560→660°C): Q₁ = mc∆T = 100 × 0.215 × 100 = 2,150 cal. Stage 2 (melting at 660°C): Q₂ = mL = 100 × 94.4 = 9,440 cal. Stage 3 (660→760°C): Q₃ = 100 × 0.215 × 100 = 2,150 cal. Total = 2,150 + 9,440 + 2,150 = <strong>13,740 ≈ 13,700 cal</strong>.",tip:"Phase change problems have 3 stages: heating before, phase change (latent heat), heating after. Don't forget the latent heat — it's usually the biggest term."},
  {q:"Speed of a transverse wave is 12 m/s and frequency is 3 Hz. What is the wavelength?",img:"",c:["0.25 m","2.00 m","4 m","36 m"],a:2,rat:"λ = v/f = 12/3 = <strong>4 m</strong>.",tip:"Always use v = fλ and rearrange: λ = v/f, f = v/λ. This is the most commonly tested wave equation. Quick check: larger wavelength = lower frequency for same speed."},
  {q:"A distance-time graph shows motion. At what time interval is the body moving at constant speed?",img:"",c:["Between a and b","Between b and c","Between c and d","Between d and e"],a:1,rat:"A straight (linear) slope on a distance-time graph = constant speed. The <strong>b to c</strong> interval shows a straight diagonal line, indicating constant velocity.",tip:"Distance-time graph: flat line = at rest; straight diagonal = constant speed; curve = acceleration. The steeper the line, the faster the speed."},
  {q:"A man sees himself 50 cm in front of a concave mirror with radius of curvature 80 cm. Where is the image?",img:"",c:["133 cm at the back","133 cm in front","200 cm at the back","200 cm in front"],a:3,rat:"f = R/2 = 40 cm. 1/f = 1/do + 1/di → 1/40 = 1/50 + 1/di → 1/di = 1/40 − 1/50 = 5/200 − 4/200 = 1/200. di = <strong>200 cm (in front)</strong> — positive = real image in front of concave mirror.",tip:"Mirror formula: 1/f = 1/do + 1/di. Focal length = R/2. Positive di = real image in front. Negative di = virtual image behind mirror."},
  {q:"One appliance in a series circuit burns out. Which of the following will stop flowing in the whole circuit?",img:"",c:["Power","Voltage","Current","Resistance"],a:2,rat:"In a series circuit, a break (burned-out appliance) interrupts the path. <strong>Current</strong> cannot flow through an open circuit. Voltage is still present; resistance increases.",tip:"Series circuit: one break = all stop. This is why series wiring is not used for home lighting — one bulb out kills the whole string."},
  {q:"What is the momentum of a 2 kg body dropped from rest at the end of 2 seconds?",img:"",c:["40.0 kg·m/s","39.2 kg·m/s","38.2 kg·m/s","35.2 kg·m/s"],a:1,rat:"v = gt = 9.8 × 2 = 19.6 m/s. p = mv = 2 × 19.6 = <strong>39.2 kg·m/s</strong>.",tip:"For free-fall problems: v = gt (from rest). Then p = mv. Use g = 9.8 m/s² for NMAT unless otherwise stated."},
  {q:"According to the Rutherford model, an atomic nucleus contains:",img:"",c:["Most of the mass and all of the positive charge","Most of the mass and all of the negative charge","All of the mass but none of the electric charge","All of the electric charge but none of the mass"],a:0,rat:"Rutherford's nuclear model: the nucleus contains protons (positive charge) and neutrons, giving it <strong>most of the atom's mass and all of its positive charge</strong>. Electrons orbit outside.",tip:"Rutherford (nuclear model): tiny dense nucleus with positive charge, electrons orbiting outside. Bohr improved this with fixed energy levels. Thomson (plum pudding) came before Rutherford."},
  {q:"Metals are good conductors of heat because their atoms have:",img:"",c:["More electrons than protons","Unstable nuclei that emit electrons","A number of valence electrons that can move easily","Electrons attracted to protons"],a:2,rat:"Metals have <strong>free/delocalized valence electrons</strong> that move easily through the lattice, carrying thermal energy rapidly from hot to cold regions.",tip:"Free electrons = conductivity. Insulators lack free electrons. This applies to both thermal and electrical conductivity in metals — same mechanism."},
  {q:"Proton, neutron, and electron arranged in increasing mass — which order is correct?",img:"",c:["Proton, neutron, electron","Electron, neutron, proton","Neutron, proton, electron","Electron, proton, neutron"],a:3,rat:"Masses: electron (9.11×10⁻³¹ kg) < proton (1.6726×10⁻²⁷ kg) < neutron (1.6749×10⁻²⁷ kg). Increasing order: <strong>electron, proton, neutron</strong>.",tip:"Neutron > proton (slightly) > electron (much smaller). Electron mass ≈ 1/1836 of proton mass. Neutron is slightly heavier than proton."},
  {q:"When two bodies are in contact, there is net heat transfer if one of the two bodies:",img:"",c:["Is at a higher temperature","Is a better conductor of heat","Has greater latent heat of fusion","Has greater specific heat capacity"],a:0,rat:"Heat flows spontaneously from <strong>higher temperature</strong> to lower temperature (Second Law / Zeroth Law of Thermodynamics). Conductivity, latent heat, and specific heat affect the rate and amount, not whether transfer occurs.",tip:"Net heat transfer occurs only when there's a temperature difference. Conductivity determines how fast heat flows, not whether it flows. Temperature difference = driving force."},
  {q:"Vector F lies in a plane with components Fₓ and Fᵧ. The magnitude of F equals:",img:IMG_Q45,c:["F − Fᵧ","√(Fₓ²)","√(Fᵧ) − Fₓ","√(Fₓ² + Fᵧ²)"],a:3,rat:"The Pythagorean theorem for vectors: |F| = √(Fₓ² + Fᵧ²). This is the resultant of two perpendicular components.",tip:"Magnitude of a 2D vector: |F| = √(Fₓ² + Fᵧ²). Direction: θ = arctan(Fᵧ/Fₓ). This is fundamental vector math — appears in many NMAT Physics questions."},
  {q:"Which particle completes: ¹³₄Be + ⁴₂He → ¹n₀ + ?",img:"",c:["p","Be¹⁴","Be¹⁶","C¹⁶"],a:3,rat:"Mass: 13 + 4 = 17 = 1 + ? → missing mass = 16. Atomic number: 4 + 2 = 6 = 0 + ? → missing atomic number = 6 = Carbon. Answer: <strong>C¹⁶ (carbon-16)</strong>.",tip:"Nuclear reactions: conserve mass number (top) and atomic number (bottom). Add both sides and solve for the unknown. Identify the element from atomic number."},
  {q:"If temperature doubles, intensity I = σT⁴ increases by how much?",img:"",c:["Twice","Four times","Eight times","Sixteen times"],a:3,rat:"I = σT⁴. If T doubles: I₂ = σ(2T)⁴ = σ × 16T⁴ = 16I₁. Intensity increases by <strong>sixteen times</strong>.",tip:"Stefan-Boltzmann Law: I = σT⁴. Any factor change in T gets raised to the 4th power. Double T → 2⁴ = 16× the intensity. Triple T → 3⁴ = 81×."},
  {q:"An object falls from an airplane. As it approaches the earth, which will happen?",img:"",c:["Its velocity increases","Its velocity decreases","Its acceleration increases","Its acceleration decreases"],a:0,rat:"Under gravity (assuming no terminal velocity here), the object accelerates downward. <strong>Velocity increases</strong> as it falls. Acceleration due to gravity remains approximately constant at 9.8 m/s² (or decreases slightly).",tip:"Free-fall: velocity increases, acceleration is constant (≈9.8 m/s²). In real air: terminal velocity is reached when air resistance = gravity, then velocity becomes constant."},
  {q:"Air temperature decreases 6.5°C per km altitude. Sea level temp = 27°C. Temperature at 5 km?",img:"",c:["59.5°C","20.5°C","0.5°C","−5.5°C"],a:3,rat:"Temperature at 5 km = 27 − (6.5 × 5) = 27 − 32.5 = <strong>−5.5°C</strong>.",tip:"Lapse rate = 6.5°C per km in troposphere. Multiply by altitude and subtract from sea-level temperature. Straightforward linear calculation."},
  {q:"A 0.600 kg ball on a 6.00 m string moves in uniform circular motion at 3.00 m/s. What is the radial acceleration?",img:"",c:["0.50 m/s²","0.90 m/s²","1.20 m/s²","1.50 m/s²"],a:3,rat:"Radial (centripetal) acceleration: a = v²/r = (3.00)²/6.00 = 9/6 = <strong>1.50 m/s²</strong>.",tip:"Centripetal acceleration: a = v²/r. Centripetal force: F = mv²/r. The mass is irrelevant for finding acceleration alone — but needed for force."},
];

let questions=[], current=0, ticker=null, seconds=45, totalSecs=45, results=[], timeTaken=[], answered=false, startTime=0;

function shuffle(arr){let a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function startQuiz(){
  totalSecs=parseInt(document.getElementById('timerSlider').value);
  results=[];timeTaken=[];current=0;
  // Shuffle questions and choices
  questions=shuffle(QUESTIONS).map(q=>{
    let ci=[...q.c.keys()];
    let sc=shuffle(ci);
    let newC=sc.map(i=>q.c[i]);
    let newA=sc.indexOf(q.a);
    return{...q,c:newC,a:newA,origImg:q.img};
  });
  show('screenQuiz');loadQuestion();
}

function loadQuestion(){
  answered=false;seconds=totalSecs;
  const q=questions[current];
  document.getElementById('qMeta').textContent=`Question ${current+1} of ${questions.length}`;
  document.getElementById('progressFill').style.width='100%';
  document.getElementById('timerBadge').textContent=fmt(seconds);
  document.getElementById('timerBadge').classList.remove('urgent');
  
  let qHTML=q.q;
  if(q.img){qHTML+=`<div class="q-img"><img src="${q.img}" alt="Question figure"></div>`;}
  document.getElementById('qCard').innerHTML=qHTML;
  
  const letters=['a','b','c','d'];
  const choicesEl=document.getElementById('choicesEl');
  choicesEl.innerHTML='';
  q.c.forEach((c,i)=>{
    const btn=document.createElement('button');
    btn.className='choice';
    btn.innerHTML=`${letters[i]}) ${c}`;
    btn.onclick=()=>answer(i,btn);
    choicesEl.appendChild(btn);
  });
  document.getElementById('ratBox').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  clearInterval(ticker);
  startTime=Date.now();
  ticker=setInterval(()=>{
    seconds--;
    document.getElementById('progressFill').style.width=(seconds/totalSecs*100)+'%';
    document.getElementById('timerBadge').textContent=fmt(seconds);
    if(seconds<=10)document.getElementById('timerBadge').classList.add('urgent');
    if(seconds<=0){clearInterval(ticker);timeTaken.push(totalSecs);reveal(null);}
  },1000);
}

function answer(idx,btn){
  if(answered)return;answered=true;clearInterval(ticker);
  timeTaken.push(Math.min(Math.round((Date.now()-startTime)/1000),totalSecs));
  reveal(idx);
}

function reveal(chosen){
  answered=true;
  const q=questions[current];
  const letters=['a','b','c','d'];
  document.querySelectorAll('.choice').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.a)b.classList.add('correct');
    else if(i===chosen)b.classList.add('wrong');
  });
  const isCorrect=chosen===q.a;
  results.push({q,chosen,isCorrect});
  let html=`<div class="rat-tag">Rationalization</div>`;
  html+=`<div><strong>Correct answer: ${letters[q.a]}) ${q.c[q.a]}</strong></div>`;
  html+=`<div style="margin-top:.5rem">${q.rat}</div>`;
  if(q.tip)html+=`<div class="nmat-tip"><div class="nmat-tip-lbl">NMAT Tip</div>${q.tip}</div>`;
  const rb=document.getElementById('ratBox');
  rb.innerHTML=html;rb.style.display='block';
  const nb=document.getElementById('nextBtn');
  nb.style.display='block';
  nb.textContent=current<questions.length-1?'Next question →':'See results →';
}

function nextQuestion(){
  current++;
  if(current>=questions.length){showResults();return;}
  loadQuestion();
}

function showResults(){
  show('screenResults');
  const correct=results.filter(r=>r.isCorrect).length;
  const total=results.length;
  const pct=Math.round(correct/total*100);
  const avg=Math.round(timeTaken.reduce((a,b)=>a+b,0)/timeTaken.length);
  document.getElementById('scoreBig').textContent=pct+'%';
  document.getElementById('scoreLbl').textContent=`${correct} of ${total} correct`;
  document.getElementById('stCorrect').textContent=correct;
  document.getElementById('stWrong').textContent=total-correct;
  document.getElementById('stTime').textContent=avg+'s';
  const letters=['a','b','c','d'];
  const list=document.getElementById('reviewList');
  list.innerHTML='';
  results.forEach((r,i)=>{
    const div=document.createElement('div');
    div.className='review-item '+(r.isCorrect?'ok':'bad');
    const qShort=r.q.q.replace(/<[^>]+>/g,'').substring(0,80)+'...';
    let ansHtml='';
    if(!r.isCorrect){
      const ya=r.chosen!==null?`${letters[r.chosen]}) ${r.q.c[r.chosen]}`:'No answer';
      ansHtml=`<span class="wrong">${ya}</span> → <span class="right">${letters[r.q.a]}) ${r.q.c[r.q.a]}</span>`;
    }else{
      ansHtml=`<span class="right">${letters[r.q.a]}) ${r.q.c[r.q.a]}</span>`;
    }
    div.innerHTML=`<div class="review-q">${i+1}. ${qShort}</div><div class="review-ans">${ansHtml}</div>`;
    list.appendChild(div);
  });
}

function goSetup(){show('screenSetup');}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function fmt(s){return'0:'+(s<10?'0':'')+Math.max(s,0);}
